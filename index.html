<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction-Diffusion Pattern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="workspace">
    <section class="simulation">
      <div class="canvas-wrap">
        <canvas id="simCanvas" width="240" height="240" role="img" aria-label="반응-확산 패턴 생성 화면">반응-확산 패턴을 표시하는 캔버스를 지원하지 않는 브라우저입니다.</canvas>
      </div>
    </section>

    <aside class="controls">
      <h2>매개변수 조절</h2>

      <div class="parameter">
        <div class="parameter-title"><label for="da">A 확산 계수 (D<sub>A</sub>)</label><output id="daOut">1.00</output></div>
        <input id="da" type="range" min="0.1" max="1.5" step="0.01" value="1">
      </div>
      <div class="parameter">
        <div class="parameter-title"><label for="db">B 확산 계수 (D<sub>B</sub>)</label><output id="dbOut">0.50</output></div>
        <input id="db" type="range" min="0.05" max="1" step="0.01" value="0.5">
      </div>
      <div class="parameter">
        <div class="parameter-title"><label for="feed">공급 속도 (f)</label><output id="feedOut">0.0550</output></div>
        <input id="feed" type="range" min="0.01" max="0.09" step="0.0005" value="0.055">
      </div>
      <div class="parameter">
        <div class="parameter-title"><label for="kill">제거 속도 (k)</label><output id="killOut">0.0620</output></div>
        <input id="kill" type="range" min="0.03" max="0.075" step="0.0005" value="0.062">
      </div>
      <div class="parameter">
        <div class="parameter-title"><label for="speed">계산 속도</label><output id="speedOut">6</output></div>
        <input id="speed" type="range" min="1" max="15" step="1" value="6">
      </div>

      <div class="actions">
        <button id="toggleBtn" class="primary" aria-pressed="true">일시정지</button>
        <button id="resetBtn">초기화</button>
        <button id="randomBtn">무작위 생성</button>
        <button id="saveBtn">PNG 저장</button>
      </div>

      <div class="preset-row">
        <label for="preset">패턴 프리셋</label>
        <select id="preset">
          <option value="custom" hidden>사용자 설정</option>
          <option value="default">기본</option>
          <option value="spots">Spots</option>
          <option value="stripes">Stripes</option>
          <option value="maze">Maze</option>
          <option value="mitosis">Mitosis</option>
        </select>
      </div>
      <div class="status"><span id="statusDot"></span><span id="statusText" role="status" aria-live="polite">실행 중</span></div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
