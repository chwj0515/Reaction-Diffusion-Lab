<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction-Diffusion Pattern</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="workspace">
    <section class="simulation">
      <canvas id="simCanvas" width="240" height="240" aria-label="반응-확산 패턴 생성 화면"></canvas>
    </section>

    <aside class="controls">
      <h2>매개변수 조절</h2>

      <div class="parameter">
        <div class="parameter-title"><label for="da">A 확산 계수 (D<sub>A</sub>)</label><output id="daOut">1.00</output></div>
        <input id="da" type="range" min="0.1" max="1.5" step="0.01" value="1">
      </div>

      <div class="parameter">
        <div class="parameter-title"><label for="db">B 확산 계수 (D<sub>B</sub>)</label><output id="dbOut">0.50</output></div>
        <input id="db" type="range" min="0.05" max="1" step="0.01" value="0.5">
      </div>

      <div class="parameter">
        <div class="parameter-title"><label for="feed">공급 속도 (f)</label><output id="feedOut">0.0550</output></div>
        <input id="feed" type="range" min="0.01" max="0.09" step="0.0005" value="0.055">
      </div>

      <div class="parameter">
        <div class="parameter-title"><label for="kill">제거 속도 (k)</label><output id="killOut">0.0620</output></div>
        <input id="kill" type="range" min="0.03" max="0.075" step="0.0005" value="0.062">
      </div>

      <div class="parameter">
        <div class="parameter-title"><label for="speed">계산 속도</label><output id="speedOut">6</output></div>
        <input id="speed" type="range" min="1" max="15" step="1" value="6">
      </div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
